# Renders the report site on the `reports` branch with biocUniTools from this
# branch, and publishes it to `gh-pages`. Scheduled workflows only run from the
# default branch, so this file lives here rather than on `reports`.

on:
  push:
    branches: [devel]
  pull_request:
    branches: [devel]
  schedule:
    - cron: "15 17 * * *" # 17:15 UTC
  workflow_dispatch:

name: quarto

jobs:
  quarto:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # The package is checked out at the top level because the deploy step
      # needs a git checkout there
      - name: Check out the package
        uses: actions/checkout@v4

      - name: Check out the report site
        uses: actions/checkout@v4
        with:
          ref: reports
          path: site

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            local::.
          needs: website

      - name: Copy vignettes into the site
        run: |
          mkdir -p site/vignettes
          cp vignettes/*.qmd site/vignettes/

      # R Universe logs are downloaded once per failing job, so keep them
      # between runs
      - name: Cache R Universe logs
        uses: actions/cache@v4
        with:
          path: site/reports/data/logs
          key: uni-logs-${{ github.run_id }}
          restore-keys: uni-logs-

      - name: Compare BBS and R Universe builds
        working-directory: site
        run: biocUniTools::write_comparisons("reports/config.yml")
        shell: Rscript {0}

      - name: Render
        working-directory: site
        run: quarto render

      - name: Deploy to GitHub pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          clean: false
          branch: gh-pages
          folder: site/docs
